name: YueDu
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  YueDu:
    type: application
    platform: iOS
    sources:
      - path: YueDu
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yuedu
        PRODUCT_NAME: YueDu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: YueDu/Info.plist

  YueDuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YueDuTests
    dependencies:
      - target: YueDu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yuedu.tests
        GENERATE_INFOPLIST_FILE: YES

  YueDuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YueDuUITests
    dependencies:
      - target: YueDu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yuedu.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  YueDu:
    build:
      targets:
        YueDu: all
        YueDuTests: [test]
        YueDuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YueDuTests
        - YueDuUITests
    archive:
      config: Release
